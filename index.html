<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>NIR English Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a5c;--indigo:#2a2466;--deep:#171250;--sun:#ffc93c;--sun2:#ffb11f;--orange:#ff7a3d;--teal:#19b6a6;--line:#dcd8f7;--ff:"Fredoka","Vazirmatn",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:#2a2466;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--ff);color:#fff}
canvas{display:block}
button,.lgb,.ans,.pb{font-family:inherit;touch-action:manipulation}
.btn{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);color:#fff;font-size:30px;display:none;align-items:center;justify-content:center;touch-action:none;box-shadow:0 6px 18px rgba(10,8,60,.35),inset 0 1px 0 rgba(255,255,255,.35);z-index:3;transition:transform .08s,background .08s}
.btn.on{background:rgba(255,255,255,.4);transform:scale(.93)}
#L{left:calc(14px + env(safe-area-inset-left))}#R{left:calc(104px + env(safe-area-inset-left))}
#J{right:calc(18px + env(safe-area-inset-right));width:98px;height:98px;background:linear-gradient(160deg,rgba(255,170,70,.75),rgba(255,110,50,.7));border-color:#ffe3b0;font-size:19px;font-weight:700;letter-spacing:.02em}
#J.on{background:linear-gradient(160deg,rgba(255,190,100,.95),rgba(255,130,60,.9))}
#hud{position:fixed;top:calc(40px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:none;gap:8px;z-index:3}
#hud button{width:44px;height:44px;border-radius:14px;border:1.5px solid rgba(255,255,255,.4);background:rgba(22,18,80,.5);color:#fff;font-size:17px;font-weight:700;font-family:inherit}
#M.off{text-decoration:line-through;opacity:.7}
.scr{position:fixed;inset:0;display:none;background:radial-gradient(120% 90% at 50% 20%,rgba(58,46,170,.62),rgba(18,14,70,.88));overflow:auto;padding:8px;box-sizing:border-box;z-index:5}
.scr.on{display:flex;animation:scrIn .25s ease both}
.scr.on .card{animation:cardIn .34s cubic-bezier(.2,.9,.3,1.15) both}
.scr.out{opacity:0;transition:opacity .2s ease;pointer-events:none;animation:none}
@keyframes scrIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scr.on,.scr.on .card{animation:none}}
.card{margin:auto;width:min(96vw,640px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px}
#menu .card,#pause .card{padding:14px 16px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);box-shadow:0 24px 60px rgba(8,6,50,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
h1{margin:0;font-size:clamp(28px,9vh,56px);line-height:1;font-weight:700;letter-spacing:.005em;text-shadow:0 4px 0 #e0561a,0 8px 18px rgba(0,0,0,.35)}
h2{margin:0;font-size:clamp(22px,6vh,36px);font-weight:700}
.sub{margin:0;font-size:clamp(15px,3.8vh,22px);font-weight:600;color:var(--sun)}
p{margin:0;line-height:1.4;font-size:clamp(14px,3.4vh,17px);font-weight:400}
.rot{display:none;color:#ffe3b0}
@media (orientation:portrait){.rot{display:block}}
#lv{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
@media (max-width:520px){#lv{grid-template-columns:repeat(3,1fr)}}
.lvb{position:relative;min-height:68px;border-radius:20px;border:0;background:linear-gradient(180deg,#fff,#fff3d1);color:var(--ink);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;font-weight:500;box-shadow:0 5px 0 #d9951a,0 10px 20px rgba(10,8,60,.3);transition:transform .08s,box-shadow .08s}
.lvb:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #d9951a,0 4px 10px rgba(10,8,60,.3)}
.lvb b{font-size:16px;font-weight:700}.lvb small{opacity:.75}
.lvb:disabled{background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.pb{font:700 clamp(16px,4vh,21px) var(--ff);color:#3a2200;background:linear-gradient(180deg,#ffd95e,var(--sun2));border:0;border-radius:999px;padding:.5em 1.4em;min-height:46px;box-shadow:0 5px 0 #c77c0a,0 10px 18px rgba(10,8,60,.25);transition:transform .08s,box-shadow .08s}
.pb:active{transform:translateY(3px);box-shadow:0 2px 0 #c77c0a}
.pb.sec{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45);}
.pb.sec:active{transform:scale(.97);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
#rc .pb.sec,#qc .pb.sec,#vc .pb.sec{background:#f1efff;color:var(--ink);box-shadow:0 5px 0 #c9c5ef}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

#qh{font-weight:600;font-size:14px;color:#5a58a6}
#qi{width:72px;height:72px;background:#fff7dc;border-radius:18px;display:none}
#qp{font-weight:700;font-size:clamp(18px,4.6vh,26px)}
#qa{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ans{min-height:48px;min-width:96px;font:600 clamp(16px,4vh,21px) var(--ff);background:#f6f5ff;color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:6px 18px;box-shadow:0 4px 0 #c9c5ef;transition:transform .08s,box-shadow .08s,background .12s}
.ans:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #c9c5ef}

#qf{font-size:clamp(14px,3.5vh,18px);line-height:1.4;min-height:0}

.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.st div{background:linear-gradient(180deg,#f5f3ff,#ebe8ff);border-radius:16px;padding:8px 2px;font-size:12px;font-weight:500}.st b{display:block;font-size:21px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:13px;font-weight:600}
.cr{font-size:12px;opacity:.9;line-height:1.5}.cr a{color:var(--sun);font-weight:600;margin:0 4px}#rc .cr{color:#5a58a6}#rc .cr a{color:#1d4fb3}
.chips span{background:#ffe9a8;border-radius:999px;padding:2px 11px}
.lgb{font:600 15px var(--ff);min-height:40px;padding:0 18px;border-radius:999px;border:0;background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}.lgb.on{background:linear-gradient(180deg,#ffd95e,var(--sun2));color:#3a2200;box-shadow:0 3px 0 #c77c0a}
.spk{min-width:44px;min-height:44px;border-radius:50%;border:0;background:#f1efff;font-size:20px;padding:0;color:var(--ink);box-shadow:0 4px 0 #c9c5ef}.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #c9c5ef}
.tl{font-size:clamp(13px,3.2vh,17px);line-height:1.4;color:#5a58a6;font-weight:500}.tl:empty{display:none}
.qrow{display:flex;align-items:center;justify-content:center;gap:10px}
@media (max-height:430px){.card{gap:6px}#menu .card,#pause .card{padding:8px 14px}#menu .logo{font-size:14px}#menu .logo svg,#menu .lgi{width:auto;height:30px}#menu [data-i=desc]{display:none}.lvb{min-height:54px;padding:5px 4px}.pb{min-height:40px}.lgb{min-height:36px}#menu .cr{font-size:11px;line-height:1.3}#qc,#rc{padding:12px 14px 10px}h1{font-size:clamp(26px,8vh,40px)}}
.lgi{max-width:180px;width:auto;object-fit:contain;background:#fff;border-radius:12px;padding:3px}
#vc{width:min(94vw,560px)}#vc p{color:#5a58a6;font-size:clamp(13px,3.2vh,16px)}
#vl{width:100%;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.vr{display:flex;align-items:center;gap:10px;background:#f6f5ff;border-radius:14px;padding:8px 10px;text-align:start}
.vr .vt{flex:1;min-width:0}.vr b{font-size:19px;font-weight:700}.vr .vx{font-size:14px;color:#3b3a78}
.stars{font-size:40px;line-height:1;letter-spacing:6px}
.stars span{display:inline-block;color:#ffb81c;text-shadow:0 3px 0 #c77c0a;opacity:0;animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards}
.stars span.off{color:#d6d3ee;text-shadow:none}
@keyframes pop{from{transform:scale(.2) rotate(-35deg);opacity:0}to{transform:none;opacity:1}}
#cd{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,6,30,.55);backdrop-filter:blur(2px);z-index:8;pointer-events:none}
#cdBanner{background:rgba(20,15,50,.7);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:8px 20px;color:#fff;font:700 15px Fredoka,Vazirmatn,sans-serif;margin-bottom:14px;letter-spacing:.3px}
#cdNum{font:800 110px Fredoka,Vazirmatn,sans-serif;color:#ffc93c;text-shadow:0 8px 0 rgba(0,0,0,.25),0 0 40px rgba(255,201,60,.5)}
#cdNum.popn{animation:cdpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes cdpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
.lvb .stl{color:#e89a00;letter-spacing:1px;font-size:14px}.lvb:disabled .stl{color:#fff}
@media (prefers-reduced-motion:reduce){.stars span{animation:none;opacity:1}}
.lvb{font-size:12px}.lvb b{font-size:15px}
</style>
</head>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const cv=$('c'),X=cv.getContext('2d',{alpha:false});
const H=360,GY=280,FIN=5250,LEN=5400,FF='Fredoka,Vazirmatn,system-ui,sans-serif';
let W=640,S=1,offY=0,cam=0,T=0,state='menu',cur=0;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,1.5),w=innerWidth,h=innerHeight;
  S=Math.min(h/H,w/480);W=w/S;offY=Math.max(0,h/S-H);
  cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';
  X.setTransform(S*dpr,0,0,S*dpr,0,0);
}
addEventListener('resize',resize);resize();

/* ---------- credits: put your website addresses in SITES, e.g. ['niracademy.com'] ---------- */
const BRAND={by:'Dr. Niki Majidi',sites:['https://niracademy.com/','https://niracademy.com/game-center/']};
function credits(){const h=tx('made')+' '+tx('by')+(BRAND.sites.length?'<br>'+BRAND.sites.map(u=>`<a dir="ltr" href="${/^https?:/.test(u)?u:'https://'+u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'')}</a>`).join(''):'');
$('cr1').innerHTML=h;$('cr2').innerHTML=h;}

/* ---------- saved progress ---------- */
const KEY='nirEnglishAdventure.v1';
let sv={unlocked:1,best:{},mute:0,lang:'en',stars:{},vocab:{},music:1,hist:{},runN:0,gq:'auto'};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){sv.unlocked=Math.max(1,s.unlocked|0);sv.best=(s.best&&typeof s.best==='object')?s.best:{};sv.mute=s.mute?1:0;if(['en','fa','tr'].includes(s.lang))sv.lang=s.lang;if(s.stars&&typeof s.stars==='object')sv.stars=s.stars;if(s.vocab&&typeof s.vocab==='object')sv.vocab=s.vocab;if(s.music===0)sv.music=0;if(s.hist&&typeof s.hist==='object')sv.hist=s.hist;sv.runN=s.runN|0;if(['auto','high','low'].includes(s.gq))sv.gq=s.gq;}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(sv));}catch(e){}};

/* ---------- audio + speech ---------- */
let AC=null;
const TTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
function say(t){if(!TTS||sv.mute||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
function hush(){if(TTS)try{speechSynthesis.cancel();}catch(e){}}
function sfx(f,d,type,v,slide){
  if(!AC||sv.mute)return;try{
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
let musT=0,musStep=0;
function musTick(){
  if(!AC||sv.mute||!sv.music||AC.state!=='running'||!(state==='play'||state==='boss'||state==='qz'||state==='cele')){musT=0;return;}
  const now=AC.currentTime,night=NIGHT[cur],bpm=[112,120,126,92,118,100][cur]||112,sd=60/bpm/2,vol=state==='qz'?.35:1;
  if(!musT||musT<now-.2)musT=now+.05;
  while(musT<now+.45){
    const bar=(musStep>>3)&3,st=musStep&7,root=[0,-3,-7,-5][bar]+([0,2,-1,-5,3,-3,1,-2][cur]||0),ch=night?[0,3,7,12]:[0,4,7,12];
    const hz=n=>262*Math.pow(2,n/12);
    const lead=[0,1,2,3,2,1,2,1][st],bo=st===0||st===4;
    try{
      const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=hz(root+ch[lead]+(st>5?12:0));
      g.gain.setValueAtTime(.0001,musT);g.gain.linearRampToValueAtTime(.022*vol,musT+.02);g.gain.exponentialRampToValueAtTime(.0001,musT+sd*1.6);
      o.connect(g);g.connect(AC.destination);o.start(musT);o.stop(musT+sd*1.7);
      if(bo){const b=AC.createOscillator(),h=AC.createGain();b.type='sine';b.frequency.value=hz(root-24);
        h.gain.setValueAtTime(.0001,musT);h.gain.linearRampToValueAtTime(.05*vol,musT+.03);h.gain.exponentialRampToValueAtTime(.0001,musT+sd*3.5);
        b.connect(h);h.connect(AC.destination);b.start(musT);b.stop(musT+sd*3.6);}
    }catch(e){}
    musT+=sd;musStep++;
  }
}
setInterval(musTick,120);
function setMute(m){sv.mute=m?1:0;if(sv.mute)hush();$('M').classList.toggle('off',!!sv.mute);$('sn').textContent=tx(sv.mute?'sndOff':'sndOn');save();}

const tx=k=>(STR[sv.lang]||STR.en)[k];
const ln=l=>(l.nn&&l.nn[sv.lang])||l.n;
const tl=(q,k)=>{const l=q.l&&q.l[sv.lang];return l?l[k]:'';};
function applyLang(){
  document.documentElement.lang=sv.lang;const rtl=sv.lang==='fa';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tx(e.dataset.i));
  document.querySelectorAll('.card').forEach(c=>c.dir=rtl?'rtl':'ltr');
  ['lv','qa','qp','lgs','rsr'].forEach(i=>$(i).dir='ltr');
  document.querySelectorAll('.lgb').forEach(b=>b.classList.toggle('on',b.dataset.l===sv.lang));
  $('sn').textContent=tx(sv.mute?'sndOff':'sndOn');credits();
}
function setLang(l){sv.lang=['en','fa','tr'].includes(l)?l:'en';applyLang();if(state==='menu')menu();save();}
document.querySelectorAll('.lgb').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

  Q('mc','Which one is a vegetable?','carrot','apple','banana','A carrot is an orange vegetable.',null,TT('کدام یک سبزی است؟','carrot یعنی هویج. هویج سبزی نارنجی رنگی است.','Hangisi bir sebzedir?','Carrot “havuç” demektir. Havuç turuncu bir sebzedir.')),
  Q('fill','We eat soup with a ___.','spoon','pen','door','We use a spoon to eat soup.',null,TT('ما سوپ را با ___ می‌خوریم.','spoon یعنی قاشق.','Çorbayı ___ ile içeriz.','Spoon “kaşık” demektir.')),
  Q('fill','I drink hot ___ in the morning.','tea','shoe','chair','Tea is a hot drink.',null,TT('صبح‌ها ___ داغ می‌نوشم.','tea یعنی چای.','Sabahları sıcak ___ içerim.','Tea “çay” demektir.')),
  B('Put the words in order.',['The','dog','is','brown'],'First the subject, then "is", then the colour.','brown',TT(BQ[0],'The dog is brown یعنی سگ قهوه‌ای است.',BQ[1],'The dog is brown “Köpek kahverengi” demektir.'))]},
 {n:'Actions and sentences',nn:{tr:'Eylemler ve cümleler',fa:'فعل‌ها و جمله‌ها'},cefr:'A1+',sky:['#4a3fb0','#ff7a8a','#ffc78a'],hl:['#8a5fb0','#c96a8f','#5f8f5f'],
  rule:{en:'Present Simple: with he/she/it the verb takes -s (she reads). Build full sentences with action words.',fa:'حال ساده: با he/she/it فعل s می‌گیرد (she reads). جمله‌های کامل با فعل‌های حرکتی بساز.',tr:'Geniş zaman: he/she/it ile fiil -s alır (she reads). Eylem kelimeleriyle tam cümleler kur.'},
  words:['fly','drink','read','small','run','sleep'],qs:[
  Q('fill','Birds can ___ in the sky.','fly','swim','cook','Birds have wings, so they can fly.',null,TT('پرنده‌ها می‌توانند در آسمان ___ کنند.','fly یعنی پرواز کردن. پرنده‌ها بال دارند.','Kuşlar gökyüzünde ___ bilir.','Fly “uçmak” demektir. Kuşların kanatları vardır.')),
  Q('fill','We ___ water when we are thirsty.','drink','eat','read','We drink water.',null,TT('وقتی تشنه‌ایم آب ___.','drink یعنی نوشیدن.','Susayınca su ___.','Drink “içmek” demektir.')),
  Q('fill','I ___ in my bed at night.','sleep','drink','fly','We sleep at night.',null,TT('شب‌ها در تختم ___.','sleep یعنی خوابیدن.','Geceleri yatağımda ___.','Sleep “uyumak” demektir.')),
  Q('fill','The dog can ___ very fast.','run','sleep','read','Dogs can run very fast.',null,TT('سگ می‌تواند خیلی تند ___.','run یعنی دویدن.','Köpek çok hızlı ___ bilir.','Run “koşmak” demektir.')),
  Q('fill','Fish can ___ in water.','swim','fly','read','Fish swim in water.',null,TT('ماهی‌ها می‌توانند در آب ___ کنند.','swim یعنی شنا کردن.','Balıklar suda ___ bilir.','Swim “yüzmek” demektir.')),
  B('Put the words in order.',['The','cat','is','small'],'First the subject (the cat), then "is", then the describing word.','small',TT(BQ[0],'اول فاعل (the cat)، بعد is، بعد کلمه‌ی توصیفی. The cat is small یعنی گربه کوچک است.',BQ[1],'Önce özne (the cat), sonra “is”, sonra niteleyen kelime. The cat is small “Kedi küçük” demektir.')),
  B('Put the words in order.',['I','can','run','fast'],'First I, then "can", then the action word.','run',TT(BQ[0],'اول I، بعد can، بعد فعل. I can run fast یعنی من می‌توانم تند بدوم.',BQ[1],'Önce I, sonra “can”, sonra eylem. I can run fast “Hızlı koşabilirim” demektir.')),
  B('Put the words in order.',['She','reads','a','book'],'With "she", the verb takes -s: reads.','read',TT(BQ[0],'با she فعل s می‌گیرد: reads. She reads a book یعنی او کتاب می‌خواند.',BQ[1],'“She” ile fiil -s alır: reads. She reads a book “O bir kitap okuyor” demektir.')),
  Q('mc',"What is the opposite of 'big'?",'small','tall','fast','Big and small are opposites.',null,TT('متضاد big چیست؟','big یعنی بزرگ و small یعنی کوچک.','“Big” kelimesinin zıt anlamlısı nedir?','Big “büyük”, small “küçük” demektir.')),
  Q('mc',"What is the opposite of 'hot'?",'cold','red','tall','Hot and cold are opposites.',null,TT('متضاد hot چیست؟','hot یعنی داغ و cold یعنی سرد.','“Hot” kelimesinin zıt anlamlısı nedir?','Hot “sıcak”, cold “soğuk” demektir.')),
  Q('mc','What do you do with a book?','read','drink','wear','You read a book.',null,TT('با کتاب چه کار می‌کنید؟','read یعنی خواندن.','Kitapla ne yaparsın?','Read “okumak” demektir.')),
  Q('fill','He ___ a book every night.','reads','read','reading','With he, she, it, the verb takes -s: reads.',null,TT('او هر شب یک کتاب ___.','با he، she و it فعل s می‌گیرد: reads.','O her gece bir kitap ___.','He, she ve it ile fiil -s alır: reads.')),
  Q('fill','We ___ football on Saturday.','play','plays','playing','With we, the verb stays the same: play.',null,TT('ما شنبه‌ها فوتبال ___.','با we فعل تغییر نمی‌کند: play.','Cumartesi günleri futbol ___.','“We” ile fiil değişmez: play.')),
  Q('fill','I ___ my teeth every morning.','brush','brushes','brushing','With I, use the base verb: brush.',null,TT('من هر صبح دندان‌هایم را ___.','با I فعل ساده می‌آید: brush یعنی مسواک زدن.','Her sabah dişlerimi ___.','“I” ile yalın fiil kullanılır: brush “fırçalamak” demektir.')),
  Q('mc','What is the opposite of "open"?','close','fast','cold','Open and close are opposites.',null,TT('متضاد open چیست؟','open یعنی باز کردن و close یعنی بستن.','“Open” kelimesinin zıt anlamlısı nedir?','Open “açmak”, close “kapatmak” demektir.')),
  Q('mc','What is the opposite of "happy"?','sad','tall','hot','Happy and sad are opposites.',null,TT('متضاد happy چیست؟','happy یعنی خوشحال و sad یعنی غمگین.','“Happy” kelimesinin zıt anlamlısı nedir?','Happy “mutlu”, sad “üzgün” demektir.')),
  Q('mc','Which word is an action?','jump','table','green','Jump is an action: you can do it.',null,TT('کدام کلمه یک کار (فعل) است؟','jump یعنی پریدن. پریدن یک کار است.','Hangi kelime bir eylemdir?','Jump “zıplamak” demektir. Zıplamak bir eylemdir.')),
  B('Put the words in order.',['She','is','reading','a','book'],'First "she is", then the action "reading", then "a book".','reading',TT(BQ[0],'She is reading a book یعنی او دارد کتاب می‌خواند.',BQ[1],'She is reading a book “O bir kitap okuyor” demektir.')),
  B('Put the words in order.',['They','play','football','after','school'],'Subject, verb, then what and when.','play',TT(BQ[0],'They play football after school یعنی آن‌ها بعد از مدرسه فوتبال بازی می‌کنند.',BQ[1],'They play football after school “Onlar okuldan sonra futbol oynar” demektir.')),
  B('Put the words in order.',['I','can','swim','very','well'],'First "I", then "can", then the action word.','swim',TT(BQ[0],'I can swim very well یعنی من خیلی خوب شنا می‌کنم.',BQ[1],'I can swim very well “Çok iyi yüzebilirim” demektir.'))]},
 {n:'Basic grammar',nn:{tr:'Temel dil bilgisi',fa:'گرامر پایه'},cefr:'A2',sky:['#0b0a38','#1b1a66','#3b2f8c'],hl:['#2e2c80','#2b5a92','#1f6b6b'],
  rule:{en:'The verb "to be" (is/am/are) and negatives with "does not": "She does not like tea."',fa:'فعل to be (is/am/are) و منفی‌سازی با does not: "She does not like tea."',tr:'"to be" fiili (is/am/are) ve "does not" ile olumsuz cümle: "She does not like tea."'},
  words:['is','am','are','goes','friends','bus'],qs:[
  Q('fill','She ___ happy.','is','are','am','Use "is" with she, he, and it.',null,TT('او خوشحال است.','با she، he و it از is استفاده می‌کنیم.','O mutlu.','She, he ve it ile “is” kullanılır.')),
  Q('fill','I ___ a student.','am','is','are','Use "am" with I.',null,TT('من یک دانش‌آموز هستم.','با I از am استفاده می‌کنیم.','Ben bir öğrenciyim.','I ile “am” kullanılır.')),
  Q('fill','They ___ playing football.','are','is','am','Use "are" with they, we, and you.',null,TT('آن‌ها فوتبال بازی می‌کنند.','با they، we و you از are استفاده می‌کنیم.','Onlar futbol oynuyor.','They, we ve you ile “are” kullanılır.')),
  Q('fill','It ___ a big dog.','is','are','am','Use "is" with it.',null,TT('آن یک سگ بزرگ است.','با it از is استفاده می‌کنیم.','O büyük bir köpek.','It ile “is” kullanılır.')),
  Q('fill','You ___ my friend.','are','is','am','Use "are" with you.',null,TT('تو دوست من هستی.','با you از are استفاده می‌کنیم.','Sen benim arkadaşımsın.','You ile “are” kullanılır.')),
  Q('fill','My sister ___ a teacher.','is','are','am','My sister is one person (she), so we use "is".',null,TT('خواهر من معلم است.','sister یک نفر است (she)، پس از is استفاده می‌کنیم.','Kız kardeşim öğretmen.','Sister tek kişidir (she), bu yüzden “is” kullanırız.')),
  Q('fill','We ___ at home now.','are','is','am','Use "are" with we.',null,TT('ما الان در خانه‌ایم.','با we از are استفاده می‌کنیم.','Şimdi evdeyiz.','We ile “are” kullanılır.')),
  Q('fill','He ___ to school by bus.','goes','go','going','With he, she, or it, we say "goes".',null,TT('او با اتوبوس به مدرسه می‌رود.','با he، she و it فعل s می‌گیرد: goes.','O okula otobüsle gider.','He, she ve it ile fiile -s/-es eklenir: goes.')),
  Q('fill','She ___ milk every morning.','drinks','drink','drinking','With she, the verb takes -s: drinks.',null,TT('او هر صبح شیر می‌نوشد.','با she فعل s می‌گیرد: drinks.','O her sabah süt içer.','“She” ile fiil -s alır: drinks.')),
  Q('fill','My brother ___ English at school.','studies','study','studying','With he, "study" becomes "studies" (y changes to ies).',null,TT('برادر من در مدرسه انگلیسی می‌خواند.','با he، study به studies تبدیل می‌شود (y به ies).','Kardeşim okulda İngilizce çalışır.','He ile “study”, “studies” olur (y, ies’e dönüşür).')),
  B('Make a sentence.',['We','are','good','friends'],'Use "are" after "we".','friends',TT('یک جمله بساز.','بعد از we از are استفاده می‌کنیم. We are good friends یعنی ما دوستان خوبی هستیم.','Bir cümle kur.','“We” den sonra “are” kullanılır. We are good friends “İyi arkadaşız” demektir.')),
  B('Make a sentence.',['He','likes','football'],'Subject, then the verb with -s, then the object.','likes',TT('یک جمله بساز.','اول فاعل، بعد فعل با s، بعد مفعول. He likes football یعنی او فوتبال را دوست دارد.','Bir cümle kur.','Önce özne, sonra -s’li fiil, sonra nesne. He likes football “O futbolu sever” demektir.')),
  Q('fill','There ___ two cats in the garden.','are','is','am','Use "there are" with more than one thing.',null,TT('در باغ دو گربه ___.','برای بیش از یک چیز از there are استفاده می‌کنیم.','Bahçede iki kedi ___.','Birden fazla şey için “there are” kullanılır.')),
  Q('fill','My parents ___ at work.','are','is','am','"Parents" means more than one person, so we use "are".',null,TT('پدر و مادرم سر کار ___.','parents جمع است (بیش از یک نفر)، پس از are استفاده می‌کنیم.','Annem ve babam işte ___.','Parents çoğuldur (birden fazla kişi), bu yüzden “are” kullanılır.')),
  Q('fill','My brother ___ TV in the evening.','watches','watch','watching','With he, she, it, add -es after "ch": watches.',null,TT('برادرم عصرها تلویزیون ___.','با he، she و it بعد از ch، es اضافه می‌شود: watches.','Kardeşim akşamları televizyon ___.','He, she ve it ile “ch” den sonra -es eklenir: watches.')),
  Q('fill','Does she ___ English?','speak','speaks','speaking','After "does", we use the base verb: speak.',null,TT('آیا او انگلیسی ___؟','بعد از does فعل ساده می‌آید: speak.','O İngilizce ___ mu?','“Does” den sonra yalın fiil kullanılır: speak.')),
  Q('mc','Which sentence is correct?','He has a bike.','He have a bike.','He haves a bike.','With he, she, it: "have" becomes "has".',null,TT('کدام جمله درست است؟','با he، she و it فعل have می‌شود has.','Hangi cümle doğru?','He, she ve it ile have, has olur.')),
  Q('mc','What is the plural of "child"?','children','childs','childes','"Child" is irregular: the plural is children.',null,TT('جمع child چیست؟','child بی‌قاعده است: جمعش children است.','“Child” kelimesinin çoğulu nedir?','Child düzensizdir: çoğulu children olur.')),
  B('Put the words in order.',['There','is','a','cat','under','the','table'],'"There is" + one thing + the place.','is',TT(BQ[0],'There is a cat under the table یعنی زیر میز یک گربه هست.',BQ[1],'There is a cat under the table “Masanın altında bir kedi var” demektir.')),
  B('Put the words in order.',['She','does','not','like','tea'],'Negative: does not + base verb.','does',TT(BQ[0],'She does not like tea یعنی او چای دوست ندارد.',BQ[1],'She does not like tea “O çayı sevmez” demektir.'))]},
 {n:'Travel and places',nn:{tr:'Seyahat ve yerler',fa:'سفر و مکان‌ها'},cefr:'A2',sky:['#6fb7e8','#bfe6f7','#eefaff'],hl:['#9fd0f0','#bfe3f5','#e4f4fc'],
  rule:{en:'Talk about places and schedules: "We are at the airport." / "The train leaves at nine."',fa:'صحبت درباره‌ی مکان‌ها و برنامه‌ها: "We are at the airport." / "The train leaves at nine."',tr:'Yerler ve programlar hakkında konuş: "We are at the airport." / "The train leaves at nine."'},
  words:['airport','ticket','hotel','map','train','passport'],qs:[
  Q('mc','Where do planes take off and land?','airport','kitchen','garden','Planes take off and land at an airport.',null,TT('هواپیماها کجا بلند می‌شوند و فرود می‌آیند؟','airport یعنی فرودگاه.','Uçaklar nerede kalkar ve iner?','Airport “havalimanı” demektir.')),
  Q('fill','You need a ___ to travel by train.','ticket','pencil','window','A ticket lets you travel by train, bus, or plane.',null,TT('برای سفر با قطار به ___ نیاز دارید.','ticket یعنی بلیت.','Trenle seyahat etmek için ___ gerekir.','Ticket “bilet” demektir.')),
  Q('mc','Where do you sleep when you travel?','hotel','bakery','school','You sleep in a hotel when you travel.',null,TT('وقتی سفر می‌کنید کجا می‌خوابید؟','hotel یعنی هتل.','Seyahat ederken nerede uyursun?','Hotel “otel” demektir.')),
  Q('mc','What helps you find the way?','map','spoon','pillow','A map shows you the way.',null,TT('چه چیزی کمک می‌کند راه را پیدا کنید؟','map یعنی نقشه.','Yolu bulmana ne yardım eder?','Map “harita” demektir.')),
  Q('mc','What do you show at the border to enter another country?','passport','umbrella','ball','You show your passport at the border.',null,TT('برای ورود به کشور دیگر، در مرز چه چیزی نشان می‌دهید؟','passport یعنی گذرنامه.','Başka bir ülkeye girmek için sınırda neyi gösterirsin?','Passport “pasaport” demektir.')),
  Q('mc','Which vehicle runs on rails?','train','taxi','bicycle','A train runs on rails.',null,TT('کدام وسیله روی ریل حرکت می‌کند؟','train یعنی قطار.','Hangi araç raylar üzerinde gider?','Train “tren” demektir.')),
  Q('mc','What is the opposite of "arrive"?','leave','visit','enter','Arrive means to get to a place. Leave means to go away.',null,TT('متضاد arrive چیست؟','arrive یعنی رسیدن و leave یعنی ترک کردن.','“Arrive” kelimesinin zıt anlamlısı nedir?','Arrive “varmak”, leave “ayrılmak” demektir.')),
  Q('fill','The train ___ at nine and arrives at eleven.','leaves','leave','leaving','With "it" (the train), the verb takes -s: leaves.',null,TT('قطار ساعت نه ___ و ساعت یازده می‌رسد.','با it (قطار) فعل s می‌گیرد: leaves.','Tren dokuzda ___ ve on birde varır.','“It” (tren) ile fiil -s alır: leaves.')),
  Q('fill','I want a window ___ on the plane.','seat','bed','door','A seat is the place where you sit.',null,TT('در هواپیما یک ___ کنار پنجره می‌خواهم.','seat یعنی صندلی.','Uçakta cam kenarı bir ___ istiyorum.','Seat “koltuk” demektir.')),
  Q('fill','The hotel is ___ the bank and the post office.','between','under','with','Between means in the middle of two things.',null,TT('هتل ___ بانک و اداره‌ی پست است.','between یعنی بین.','Otel banka ile postane ___.','Between “arasında” demektir.')),
  Q('fill','We are going ___ a trip to Istanbul.','on','at','in','We say "go on a trip".',null,TT('ما به یک سفر به استانبول می‌رویم.','می‌گوییم go on a trip.','Biz İstanbul’a bir geziye çıkıyoruz.','“Go on a trip” deriz.')),
  Q('mc','Where do trains and buses stop for passengers?','station','garden','kitchen','Passengers wait at a station.',null,TT('قطارها و اتوبوس‌ها کجا برای مسافران می‌ایستند؟','station یعنی ایستگاه.','Tren ve otobüsler yolcular için nerede durur?','Station “istasyon” demektir.')),
  Q('mc','What do you carry your clothes in when you travel?','suitcase','envelope','bottle','A suitcase carries your clothes.',null,TT('وقتی سفر می‌کنید لباس‌هایتان را در چه چیزی می‌برید؟','suitcase یعنی چمدان.','Seyahat ederken kıyafetlerini neyin içinde taşırsın?','Suitcase “bavul” demektir.')),
  B('Put the words in order.',['We','are','at','the','airport'],'First "we", then "are", then the place.','airport',TT(BQ[0],'We are at the airport یعنی ما در فرودگاه هستیم.',BQ[1],'We are at the airport “Havalimanındayız” demektir.')),
  B('Put the words in order.',['The','train','leaves','at','nine'],'With "the train", the verb takes -s: leaves.','train',TT(BQ[0],'The train leaves at nine یعنی قطار ساعت نه حرکت می‌کند.',BQ[1],'The train leaves at nine “Tren dokuzda kalkar” demektir.')),
  B('Put the words in order.',['I','need','a','map','of','the','city'],'First "I need", then "a map", then "of the city".','map',TT(BQ[0],'I need a map of the city یعنی من به یک نقشه‌ی شهر نیاز دارم.',BQ[1],'I need a map of the city “Şehrin bir haritasına ihtiyacım var” demektir.'))]},
 {n:'Past simple',nn:{tr:'Geçmiş zaman',fa:'گذشته‌ی ساده'},cefr:'A2+',sky:['#0a2a3a','#134b5e','#2a6f73'],hl:['#1d5c66','#1f7a78','#2c8f7a'],
  rule:{en:'Past Simple: irregular verbs change form (go→went, eat→ate, see→saw). Questions use "did": "What did she buy?"',fa:'گذشته‌ی ساده: افعال بی‌قاعده شکل عوض می‌کنند (go→went, eat→ate, see→saw). سؤال با did ساخته می‌شود: "What did she buy?"',tr:'Geçmiş zaman: düzensiz fiiller şekil değiştirir (go→went, eat→ate, see→saw). Sorularda "did" kullanılır: "What did she buy?"'},
  words:['went','ate','saw','bought','yesterday','last'],qs:[
  Q('fill','Yesterday I ___ to the park.','went','go','going','"Went" is the past of "go".',null,TT('دیروز من به پارک ___.','went گذشته‌ی go است، یعنی رفتم.','Dün parka ___.','Went, go fiilinin geçmişidir: gittim.')),
  Q('fill','She ___ a sandwich for lunch.','ate','eat','eating','"Ate" is the past of "eat".',null,TT('او برای ناهار ساندویچ ___.','ate گذشته‌ی eat است، یعنی خورد.','O öğle yemeğinde sandviç ___.','Ate, eat fiilinin geçmişidir: yedi.')),
  Q('fill','We ___ a great film last night.','saw','see','sees','"Saw" is the past of "see".',null,TT('دیشب ما یک فیلم عالی ___.','saw گذشته‌ی see است، یعنی دیدیم.','Dün gece harika bir film ___.','Saw, see fiilinin geçmişidir: gördük.')),
  Q('fill','He ___ a new bag yesterday.','bought','buy','buys','"Bought" is the past of "buy".',null,TT('او دیروز یک کیف نو ___.','bought گذشته‌ی buy است، یعنی خرید.','O dün yeni bir çanta ___.','Bought, buy fiilinin geçmişidir: aldı.')),
  Q('fill','I ___ TV last night.','watched','watch','watching','Regular verbs take -ed in the past: watched.',null,TT('من دیشب تلویزیون ___.','فعل‌های باقاعده در گذشته ed می‌گیرند: watched.','Dün gece televizyon ___.','Düzenli fiiller geçmişte -ed alır: watched.')),

  if(!pick.length)return;
  prac=true;qsel=pick;relAll();openQuiz(0);
}

function startBoss(){
  state='boss';relAll();ctl(0);p.vx=0;p.vy=0;bossOn=true;
  bs.ph='in';bs.t=0;bs.x=p.x+200;bs.y=-90;bs.vy=0;bs.land=0;bs.hp=bs.max;bs.flash=0;bs.dx=0;
  const ownPool=lru(LV[cur].qs.filter(q=>!qsel.includes(q)));
  const priorWeak=cur>0?lru(LV.slice(0,cur).flatMap(l=>l.qs).filter(q=>sv.vocab[q.w])).slice(0,2):[];
  bossPool=shuffle(ownPool.concat(priorWeak)).reverse();

}
function askBoss(){
  bs.ph='ask';if(!bossPool.length)bossPool=lru(LV[cur].qs.filter(q=>q!==qsel[qsel.length-1])).reverse();
  const bq=bossPool.pop();use(bq);qsel.push(bq);openQuiz(qsel.length-1);
}
function updateBoss(dt){
  bs.t+=dt;p.inv-=dt;bs.flash=Math.max(0,bs.flash-dt);
  cam+=(Math.max(0,Math.min(LEN-W,p.x+110-W*.5))-cam)*Math.min(1,dt*4);
  if(bs.ph==='in'){bs.vy+=1100*dt;bs.y=Math.min(GY,bs.y+bs.vy*dt);
    if(bs.y>=GY&&!bs.land){bs.land=1;shake=.4;spawn(bs.x,GY,14,'#f3e3b5',60,'dust');sfx(90,.3,'sawtooth',.08,40);}
    if(bs.t>2)askBoss();}

  else if(bs.ph==='atk'){bs.dx=-Math.sin(Math.min(1,bs.t/.6)*Math.PI)*90;
    if(bs.t>.28&&!bs.did){bs.did=1;p.inv=0;hurt(-1);if(state==='boss'){p.vx=0;p.vy=0;p.g=true;p.y=GY;}}
    if(bs.t>1.1&&state==='boss'){bs.dx=0;askBoss();}}

}

  if(cur===4){X.fillStyle='rgba(120,200,255,.07)';X.fillRect(-10,-offY-6,W+20,H+offY+20);}
  if(NIGHT[cur]){X.fillStyle='rgba(12,10,70,.16)';X.fillRect(-10,-offY-6,W+20,H+offY+20);}
  else if(cur===2){X.fillStyle='rgba(255,110,60,.07)';X.fillRect(-10,-offY-6,W+20,H+offY+20);}
  X.restore();
  if(state==='menu')return;
  X.textBaseline='middle';
  X.fillStyle='rgba(22,18,80,.5)';rr(10,8,124,48,17);X.fill();
  X.strokeStyle='rgba(255,255,255,.22)';X.lineWidth=1.5;rr(10,8,124,48,17);X.stroke();
  X.fillStyle='#e29a10';X.beginPath();X.arc(27,24,9.5,0,6.3);X.fill();X.fillStyle='#ffd84a';X.beginPath();X.arc(27,24,8,0,6.3);X.fill();X.fillStyle='#fff3a8';X.fillRect(23.5,19,2.5,6);
  X.fillStyle='#fff';X.font='700 16px '+FF;X.fillText(coinN+'/'+coinTot,42,25);
  X.font='500 13px '+FF;X.fillStyle='rgba(255,255,255,.9)';X.fillText(tx('score')+' '+score,22,43);
  {const ch=[];if(combo>=2)ch.push('🔥 x'+mult(combo));if(pw.sh)ch.push('🛡️');if(pw.mag>0)ch.push('🧲 '+Math.ceil(pw.mag));if(pw.dj>0)ch.push('🦘 '+Math.ceil(pw.dj));
   X.textAlign='left';X.font='600 13px '+FF;ch.forEach((t,i)=>{const w=X.measureText(t).width+18;X.fillStyle='rgba(22,18,80,.55)';rr(10,62+i*26,w,22,11);X.fill();X.fillStyle='#fff';X.fillText(t,19,73+i*26);});}
  X.fillStyle='rgba(22,18,80,.5)';rr(W-104,8,94,34,17);X.fill();
  X.strokeStyle='rgba(255,255,255,.22)';rr(W-104,8,94,34,17);X.stroke();
  for(let i=0;i<3;i++)heart(W-82+i*26,24,9,i<hearts?'#ff4d6d':'rgba(255,255,255,.28)');
  const bw=Math.min(160,W*.28),bx=W/2-bw/2,pr=Math.min(1,p.x/FIN);
  X.fillStyle='rgba(22,18,80,.5)';rr(bx-4,10,bw+8,14,7);X.fill();
  const pg=X.createLinearGradient(bx,0,bx+bw,0);pg.addColorStop(0,'#ffd95e');pg.addColorStop(1,'#ff7a3d');X.fillStyle=pg;rr(bx,13,Math.max(8,bw*pr),8,4);X.fill();
  X.fillStyle='rgba(255,255,255,.85)';CP.forEach((c,i)=>{X.beginPath();X.arc(bx+bw*c/FIN,17,2.2,0,6.3);X.fill();});
  if(toast.t>0){X.textAlign='center';X.font='600 16px '+FF;const tw=Math.max(150,X.measureText(toast.s).width+34);const tg=X.createLinearGradient(0,44,0,72);tg.addColorStop(0,'rgba(58,49,144,.92)');tg.addColorStop(1,'rgba(36,29,99,.92)');X.fillStyle=tg;rr(W/2-tw/2,46,tw,28,14);X.fill();X.fillStyle='#ffe27a';X.fillText(toast.s,W/2,60);X.textAlign='left';}
}

/* ---------- main loop ---------- */
reset(0);setMute(sv.mute);setLang(sv.lang);menu();
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min((t-last)/1000,.066);last=t;
  if(document.hidden)return;
  T+=dt;if(shake>0)shake-=dt;if(toast.t>0)toast.t-=dt;
  if(state==='play'){gfxFa+=dt;gfxFn++;if(gfxFn>=120){if(sv.gq==='auto'&&hq&&gfxFa/gfxFn>1/38)hq=false;gfxFa=gfxFn=0;}}
  if(state==='play'){const n=Math.ceil(dt/.0167)||1;for(let i=0;i<n&&state==='play';i++)update(dt/n);}
  else if(state==='boss')updateBoss(dt);
  else if(state==='menu'){cam+=70*dt;if(cam>LEN-W-10)cam=0;}
  else if(state==='cele'){celeT+=dt;if(Math.random()<.3)spawn(cam+Math.random()*W,30,1,['#ffd84a','#ff6a8d','#6fd0ff','#7ee06a'],40,'conf');if(celeT>1.7)showRes(true);}
  else if(state==='res'&&hearts>0&&p.x>FIN){winT+=dt;if(winT<2.5&&Math.random()<.5)spawn(cam+Math.random()*W,40,1,['#ffd84a','#ff6a8d','#6fd0ff','#7ee06a'],40,'conf');}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;q.vy+=(q.k==='dust'?25:380)*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.l<=0)parts.splice(i,1);}
  draw();
}
requestAnimationFrame(frame);
})();
